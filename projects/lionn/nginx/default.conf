# ============================================================
# Upstream FastCGI backend mapping to Magento PHP-FPM container
# [ Mapeamento do backend FastCGI para o container PHP-FPM ]
# ============================================================
upstream fastcgi_backend {
    server magento_server:9000;
}

# ============================================================
# Rate limiting zone to prevent Denial of Service (DoS)
# [ Zona de limitação de taxa para prevenir ataques DoS ]
# ============================================================
limit_req_zone $binary_remote_addr zone=one:10m rate=5r/s;


# ============================================================
# HTTP - Port 80
# Redirect all unencrypted traffic to HTTPS
# [ Redireciona todo tráfego HTTP para HTTPS ]
# ============================================================
server {
    listen 80;
    server_name seusite.com.br www.seusite.com.br;

    # Block direct IP access requests
    # [ Bloqueia acesso direto através do endereço IP ]
    if ($host ~* "\d+\.\d+\.\d+\.\d+") {
        return 444;
    }

    # Permanent redirect HTTP -> HTTPS
    # [ Redirecionamento permanente HTTP -> HTTPS ]
    return 301 https://$host$request_uri;
}


# ============================================================
# HTTPS - Port 443
# Main Magento Server
# [ Servidor principal Magento ]
# ============================================================
server {
    listen 443 ssl;
    http2 on;

    server_name seusite.com.br www.seusite.com.br;
    
    # ========================================================
    # SSL Certificate
    # [ Certificado SSL ]
    # ========================================================
    ssl_certificate /etc/nginx/ssl/seusite.com.br.pem;
    ssl_certificate_key /etc/nginx/ssl/seusite.com.br.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;


    # ========================================================
    # HTTP Security Headers
    # [ Cabeçalhos de segurança HTTP ]
    #
    # CSP is managed dynamically by Magento.
    # [ CSP é gerenciado dinamicamente pelo Magento. ]
    # ========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS
    # [ Força utilização de HTTPS ]
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;


    # ========================================================
    # Magento configuration
    # [ Configuração do Magento ]
    # ========================================================
    set $MAGE_ROOT /var/www/html;
    set $MAGE_MODE production;

    root $MAGE_ROOT/pub;

    index index.php;

    include /etc/nginx/mime.types;


    # ========================================================
    # Upload limit
    # [ Limite de upload ]
    #
    # Mantido em 2G conforme configuração original.
    # ========================================================
    client_max_body_size 2G;


    # ========================================================
    # GZIP Compression
    # [ Compressão GZIP ]
    # ========================================================
    gzip on;
    gzip_disable "msie6";

    gzip_comp_level 6;
    gzip_min_length 1100;

    gzip_buffers 16 8k;

    gzip_proxied any;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;


    # ============================================================
    # INCIDENT RESPONSE
    #
    # Block exploited customer address upload endpoint.
    #
    # This endpoint was observed during the attack.
    #
    # IMPORTANT:
    # This is an additional Nginx mitigation.
    # It does NOT replace the official Magento security patch.
    #
    # [ Bloqueia o endpoint de upload explorado.
    #   Esta regra é uma camada adicional de segurança e não
    #   substitui o patch oficial do Magento. ]
    # ============================================================
    location ^~ /customer/address_file/upload {
        return 403;
    }


    # ============================================================
    # INCIDENT RESPONSE
    #
    # Block Magento guest cart API.
    #
    # The current installation does not use checkout.
    # This endpoint was observed in the attack chain.
    #
    # [ Bloqueia a API de carrinho de visitante do Magento.
    #   A instalação atual não utiliza checkout.
    #   Este endpoint foi observado na cadeia do ataque. ]
    # ============================================================
    location ^~ /rest/V1/guest-carts {
        return 403;
    }


    # ============================================================
    # INCIDENT RESPONSE
    #
    # Block directories involved in the compromise.
    #
    # /media/customer/
    # /media/customer_address/
    # /media/custom_options/
    #
    # These locations were involved in the observed attack.
    #
    # [ Bloqueia completamente os diretórios envolvidos
    #   no comprometimento identificado. ]
    # ============================================================

    location ^~ /media/customer/ {
        return 403;
    }

    location ^~ /media/customer_address/ {
        return 403;
    }

    location ^~ /media/custom_options/ {
        return 403;
    }


    # ============================================================
    # Main Magento application
    # [ Aplicação principal Magento ]
    # ============================================================
    location / {
        limit_req zone=one burst=20 nodelay;

        try_files $uri $uri/ /index.php?$args;
    }


    # ============================================================
    # Static assets
    # [ Arquivos estáticos ]
    # ============================================================
    location /static/ {
        try_files $uri $uri/ /static.php?resource=$uri&$args;

        expires max;
        access_log off;
    }


    # ============================================================
    # Static content versioning
    # [ Versionamento dos arquivos estáticos ]
    # ============================================================
    location ~ ^/static/version {
        rewrite ^/static/version\d+/(.*)$ /static/$1 break;
    }


    # ============================================================
    # Magento WYSIWYG thumbnails
    #
    # Magento Media Gallery generates thumbnails inside:
    #
    #     pub/media/.thumbswysiwyg/
    #
    # This directory starts with "." and would normally be
    # blocked by the generic hidden-file rule below.
    #
    # The ^~ modifier gives this location priority over the
    # generic regex used to block hidden files.
    #
    # [ As thumbnails do Media Gallery ficam dentro de:
    #
    #   pub/media/.thumbswysiwyg/
    #
    #   Como o diretório começa com ".", a regra genérica
    #   de arquivos ocultos bloquearia essas imagens.
    #
    #   O ^~ garante prioridade para esta location. ]
    # ============================================================
    location ^~ /media/.thumbswysiwyg/ {
        expires max;
        access_log off;
    }


    # ============================================================
    # Magento Media Library
    # [ Biblioteca de mídia do Magento ]
    # ============================================================
    location /media/ {
        try_files $uri $uri/ /get.php?$args;

        expires max;
        access_log off;
    }


    # ============================================================
    # SECURITY
    #
    # Block PHP and PHP-related executable extensions inside
    # Magento media directories.
    #
    # Covers:
    #
    # .php
    # .php7
    # .php8
    # .phtml
    # .pht
    # .phtm
    # .phar
    #
    # This protects against uploaded webshells and similar
    # payloads being accessed through the web server.
    #
    # [ Bloqueia arquivos potencialmente executáveis dentro
    #   de media. ]
    # ============================================================
    location ~* ^/media/.*\.(?:php|php[0-9]+|phtml|pht|phtm|phar)$ {
        return 403;
    }


    # ============================================================
    # Block sensitive files and backups
    #
    # [ Bloqueia arquivos sensíveis e backups ]
    # ============================================================
    location ~* \.(?:env|log|sql|lock|bak|old|orig|save|swp|tmp|gz|zip|tar|tgz|7z|rar|exe|piff)$ {
        deny all;
    }


    # ============================================================
    # Block sensitive Magento directories
    #
    # app/
    # var/
    # vendor/
    # setup/
    # dev/
    #
    # These directories should not be directly accessible
    # through the web server in production.
    #
    # [ Diretórios internos do Magento não devem ser acessíveis
    #   diretamente pelo servidor web em produção. ]
    # ============================================================
    location ~* ^/(?:app|var|vendor|setup|dev)(?:/|$) {
        deny all;
    }


    # ============================================================
    # Block hidden files and directories
    #
    # Examples:
    #
    # /.git
    # /.env
    # /.htaccess
    # /.user.ini
    #
    # .thumbswysiwyg is explicitly handled above.
    #
    # [ Bloqueia arquivos e diretórios ocultos.
    #   .thumbswysiwyg possui uma exceção específica acima. ]
    # ============================================================
    location ~ /\. {
        deny all;
    }


    # ============================================================
    # PHP FastCGI
    # [ Processamento PHP através do PHP-FPM ]
    # ============================================================
    location ~ \.php$ {

        # Only execute existing PHP files
        # [ Só executa arquivos PHP existentes ]
        try_files $uri =404;

        fastcgi_pass fastcgi_backend;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;

        include fastcgi_params;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Change default PHPSESSID cookie name 
        # [ Alterar o nome padrão do cookie PHPSESSID ]
        fastcgi_param PHP_VALUE "session.name=M2IDSS";
    }
}
