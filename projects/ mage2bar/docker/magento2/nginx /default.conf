# Upstream FastCGI backend mapping to Magento PHP-FPM container
# [ Mapeamento do backend FastCGI Upstream para o container PHP-FPM do Magento ]
upstream fastcgi_backend {
    server magento_server:9000;
}

# Rate limiting zone to prevent Denial of Service (DoS) attacks
# [ Zona de limitação de taxa para prevenir ataques de Negação de Serviço (DoS) ]
limit_req_zone $binary_remote_addr zone=one:10m rate=5r/s;

# HTTP (Port 80) Server Block - Redirects all unencrypted traffic to HTTPS
# [ Bloco de Servidor HTTP (Porta 80) - Redireciona todo o tráfego não criptografado para HTTPS ]
server {
    listen 80;
    server_name lionn.net www.lionn.net;

    # Block direct IP access requests
    # [ Bloqueia requisições de acesso direto via endereço IP ]
    if ($host ~* "\d+\.\d+\.\d+\.\d+") {
        return 444;
    }

    # Redirect HTTP to HTTPS permanently
    # [ Redireciona HTTP para HTTPS permanentemente ]
    return 301 https://$host$request_uri;
}

# HTTPS (Port 443) Main Server Block
# [ Bloco de Servidor Principal HTTPS (Porta 443) ]
server {
    listen 443 ssl;
    http2 on;
    server_name lionn.net www.lionn.net;

    # SSL Certificate and Private Key definitions
    # [ Definições de Certificado SSL e Chave Privada ]
    ssl_certificate /etc/nginx/ssl/lionn.net.pem;
    ssl_certificate_key /etc/nginx/ssl/lionn.net.key;

    # Secure SSL Protocols and Ciphers configuration
    # [ Configuração de Protocolos e Cifras SSL Seguras ]
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Additional HTTP Security Headers (CSP is dynamically managed by Magento PHP)
    # [ Cabeçalhos de Segurança HTTP Adicionais (CSP é gerido dinamicamente pelo PHP do Magento) ]
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    
    # HTTP Strict Transport Security (HSTS) - Forces HTTPS for 1 year
    # [ HTTP Strict Transport Security (HSTS) - Força HTTPS por 1 ano ]
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Magento Root Directory and Production Mode declaration
    # [ Declaração do Diretório Raiz e Modo de Produção do Magento ]
    set $MAGE_ROOT /var/www/html;
    set $MAGE_MODE production;

    root $MAGE_ROOT/pub;
    index index.php;

    include /etc/nginx/mime.types;

    # Maximum allowed request body size for uploads
    # [ Tamanho máximo permitido do corpo da requisição para uploads ]
    client_max_body_size 2G;

    # Gzip Compression to improve page load speed
    # [ Compressão Gzip para melhorar a velocidade de carregamento da página ]
    gzip on;
    gzip_disable "msie6";
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Block access to REST and GraphQL APIs if external consumers are restricted
    # [ Bloqueia acesso às APIs REST e GraphQL caso o acesso externo seja restrito ]
    location ~ ^/(rest|graphql) {
        return 444;
    }

    # Main root location processing with rate limiting
    # [ Processamento da localização raiz principal com limitação de taxa ]
    location / {
        limit_req zone=one burst=20 nodelay;
        try_files $uri $uri/ /index.php?$args;
    }

    # Static assets handling (JS, CSS, Images, Fonts)
    # [ Manipulação de arquivos estáticos (JS, CSS, Imagens, Fontes) ]
    location /static/ {
        try_files $uri $uri/ /static.php?resource=$uri&$args;
        expires max;
        access_log off;
    }

    # Static versioning rewrite rules for deployment asset caching
    # [ Regras de reescrita de versionamento estático para cache de deploy ]
    location ~ ^/static/version {
        rewrite ^/static/version\d+/(.*)$ /static/$1 break;
    }

    # Media library files handling and PHP execution prevention
    # [ Manipulação de arquivos da biblioteca de mídia e prevenção de execução de PHP ]
    location /media/ {
        try_files $uri $uri/ /get.php?$args;
        expires max;
        access_log off;

        # Prevent PHP script execution inside uploads directory
        # [ Previne a execução de scripts PHP dentro do diretório de uploads ]
        location ~* \.php$ {
            deny all;
        }
    }

    # Block access to sensitive system files and backups
    # [ Bloqueia o acesso a arquivos sensíveis do sistema e backups ]
    location ~* \.(env|log|sql|lock|bak|gz|exe|piff)$ {
        deny all;
    }

    # Block access to sensitive Magento system directories
    # [ Bloqueia o acesso a diretórios sensíveis do sistema Magento ]
    location ~* /(app|var|vendor|setup|dev)/ {
        deny all;
    }

    # Block access to hidden files (starting with dot like .htaccess, .git)
    # [ Bloqueia o acesso a arquivos ocultos (iniciados com ponto como .htaccess, .git) ]
    location ~ /\. {
        deny all;
    }

    # PHP FastCGI processing section
    # [ Seção de processamento PHP FastCGI ]
    location ~ \.php$ {
        try_files $uri =404;

        fastcgi_pass fastcgi_backend;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;
        include fastcgi_params;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }
}
