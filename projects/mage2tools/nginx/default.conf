upstream fastcgi_backend {
    server magento_server:9000;
}

server {
    listen 80;
    server_name _;

    set $MAGE_ROOT /var/www/html;
    root $MAGE_ROOT/pub;

    index index.php;
    autoindex off;

    client_max_body_size 512MB;

    # GZIP
    gzip on;
    gzip_disable "msie6";
    gzip_comp_level 6;
    gzip_min_length 1100;
    gzip_buffers 16 8k;
    gzip_proxied any;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # Cabecalhos de seguranca
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bloqueio de PHP em arquivos de mídia
    location ~* ^/media/.*\.(php|php[0-9]+|phtml|pht|phtm|phar)$ {
        deny all;
    }

    # Bloqueio de arquivos sensíveis
    location ~* \.(env|log|sql|bak|old|orig|save|swp|tmp|lock)$ {
        deny all;
    }

    # Bloqueio de diretórios internos
    location ~* ^/(app|var|vendor|setup|dev)(/|$) {
        deny all;
    }

    # Arquivos ocultos
    location ~ /\.(?!well-known/) {
        deny all;
    }

    # Arquivos de validação
    location ^~ /.well-known/ {
        allow all;
        try_files $uri $uri/ =404;
    }

    # Aplicação Magento
    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    # Arquivos estáticos
    location /static/ {
        expires max;
        access_log off;

        try_files $uri $uri/ /static.php?resource=$uri&$args;
    }

    # Versionamento dos arquivos estáticos
    location ~ ^/static/version {
        rewrite ^/static/version\d+/(.*)$ /static/$1 last;
    }

    # Biblioteca de mídia
    location /media/ {
        expires max;
        access_log off;

        try_files $uri $uri/ /get.php$is_args$args;
    }

    # Miniaturas do Media Gallery
    location ^~ /media/.thumbswysiwyg/ {
        expires max;
        access_log off;
    }

    # PHP FastCGI
    # Somente os endpoints necessários do Magento 2
    location ~ ^/(index|get|static|report|404|503)\.php$ {
        try_files $uri =404;

        fastcgi_pass fastcgi_backend;
        fastcgi_index index.php;

        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param MAGE_ROOT $MAGE_ROOT;
        fastcgi_param HTTPS off;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 32k;
        fastcgi_busy_buffers_size 64k;

        fastcgi_read_timeout 300s;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;
    }

    # Bloqueia qualquer outro arquivo PHP
    location ~ \.php$ {
        return 404;
    }
}

