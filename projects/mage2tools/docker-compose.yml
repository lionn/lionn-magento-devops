services:

  magento_db:
    image: mariadb:10.6
    container_name: magento_db
    restart: always
    env_file:
      - .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
    networks:
      - magento_rede
    security_opt:
      - no-new-privileges:true

  magento_redis:
    image: redis:7
    container_name: magento_redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - magento_rede
    security_opt:
      - no-new-privileges:true

  magento_opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: magento_opensearch
    restart: always
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - bootstrap.memory_lock=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - magento_rede
    security_opt:
      - no-new-privileges:true

  magento_server:
    build: .
    container_name: magento_server
    restart: always
    volumes:
      - ./html:/var/www/html
    expose:
      - "9000"
    depends_on:
      - magento_db
      - magento_redis
      - magento_opensearch
    networks:
      - magento_rede
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  magento_nginx:
    image: nginxinc/nginx-unprivileged:alpine
    container_name: magento_nginx
    restart: always
    group_add:
      - "1001"
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./html:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      magento_server:
        condition: service_healthy
    networks:
      - magento_rede
    security_opt:
      - no-new-privileges:true

networks:
  magento_net:
    driver: bridge
