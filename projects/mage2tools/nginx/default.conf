# ============================================================
# Upstream FastCGI backend mapping to Magento PHP-FPM container
# [ Mapeamento do backend FastCGI para o container PHP-FPM ]
# ============================================================
upstream fastcgi_backend {
    server magento_server:9000;
}

# ============================================================
# Rate limiting zone to prevent Denial of Service (DoS)
# [ Zona de limitação de taxa para prevenir ataques DoS ]
#
# Ajustado de 5r/s para 20r/s: o Magento carrega dezenas de
# assets por página. 5r/s com burst=20 rejeitava picos legítimos.
# [ Ajustado para não bloquear carregamentos normais do Magento ]
# ============================================================
limit_req_zone $binary_remote_addr zone=one:10m rate=20r/s;


# ============================================================
# HTTP - Port 8080
# Redirect all unencrypted traffic to HTTPS
# [ Redireciona todo tráfego HTTP para HTTPS ]
# ============================================================
server {
    listen 8080;
    server_name seusite.com.br www.seusite.com.br; # Altere com o seu dominio

    # Block direct IP access requests
    # [ Bloqueia acesso direto através do endereço IP ]
    if ($host ~* "\d+\.\d+\.\d+\.\d+") {
        return 444;
    }

    # Permanent redirect HTTP -> HTTPS
    # [ Redirecionamento permanente HTTP -> HTTPS ]
    return 301 https://$host$request_uri;
}


# ============================================================
# HTTPS - Port 8443
# Main Magento 2 Server
# [ Servidor Principal Magento 2 ]
# ============================================================
server {
    listen 8443 ssl;
    http2 on;

    server_name seusite.com.br www.seusite.com.br; # Altere com o seu dominio

    # ========================================================
    # SSL Certificate
    # [ Certificado SSL ]
    # ========================================================
    ssl_certificate /etc/nginx/ssl/sua-chave-publica.pem; # Altere o caminho com a sua chave Pública
    ssl_certificate_key /etc/nginx/ssl/sua-chave-privada.key; # Altere o caminho com a sua chave Privada

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;


    # ========================================================
    # HTTP Security Headers
    # [ Cabeçalhos de segurança HTTP ]
    #
    # CSP is managed dynamically by Magento.
    # [ CSP é gerenciado dinamicamente pelo Magento. ]
    # ========================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HSTS
    # [ Força utilização de HTTPS ]
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # COOP
    # Cabeçalho COOP (Isolamento de Janela)
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    

    # ========================================================
    # Magento configuration
    # [ Configuração do Magento ]
    # ========================================================
    set $MAGE_ROOT /var/www/html;
    set $MAGE_MODE production;

    root $MAGE_ROOT/pub;

    index index.php;

    include /etc/nginx/mime.types;


    # ========================================================
    # Upload limit
    # [ Limite de upload ]
    #
    # Mantido em 512M (ajuste o campo abaixo para enviar arquivos maiores...)
    # ========================================================
    client_max_body_size 512M;


    # ========================================================
    # GZIP Compression
    # [ Compressão GZIP ]
    # ========================================================
    gzip on;
    gzip_disable "msie6";

    gzip_comp_level 6;
    gzip_min_length 1100;

    gzip_buffers 16 8k;

    gzip_proxied any;

    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;


    # ============================================================
    # SECURITY — Bloqueios específicos de CVE e incident response
    #
    # IMPORTANTE:
    # Estes bloqueios são camada adicional do Nginx.
    # NÃO substituem os patches oficiais do Magento.
    # [ Não substituem os patches oficiais do Magento. ]
    # ============================================================

    # ------------------------------------------------------------
    # SessionReaper (CVE-2025-54236)
    #
    # Bloqueia o endpoint de upload explorado e a API REST de
    # guest carts usada como gatilho.
    #
    # ATENÇÃO: o bloqueio de /rest/.*/guest-carts afeta a API
    # REST. Se você usa PWA/headless, revise antes.
    # [ Bloqueia upload explorado e guest-carts ]
    # ------------------------------------------------------------
    location ^~ /customer/address_file/upload {
        return 403;
    }

    location ~* ^/rest/.*/guest-carts {
        return 403;
    }

    # ------------------------------------------------------------
    # PolyShell (APSB25-94)
    #
    # Bloqueia diretórios de upload explorados e execução de
    # qualquer PHP em media/.
    # [ Bloqueia uploads e PHP em media/ ]
    # ------------------------------------------------------------
    location ^~ /media/customer/ {
        return 403;
    }

    location ^~ /media/customer_address/ {
        return 403;
    }

    location ^~ /media/custom_options/ {
        return 403;
    }

    location ~* ^/media/.*\.(?:php|php[0-9]+|phtml|pht|phtm|phar)$ {
        return 403;
    }

    # ------------------------------------------------------------
    # StyleSmuggler (CVE-2026-75650)
    #
    # Bloqueia GraphQL com styles e URIs contendo tag PHP.
    # [ Bloqueia vetores do StyleSmuggler ]
    # ------------------------------------------------------------
    if ($args ~* "styles(\[|%5b)") {
        return 403;
    }

    if ($request_uri ~* "(<\?|%3c%3f)") {
        return 403;
    }


    # ============================================================
    # CORREÇÃO: .well-known (ACME / Cloudflare / validações)
    #
    # A regra genérica "location ~ /\. { deny all; }" bloqueia
    # QUALQUER caminho contendo "/.", incluindo "/.well-known/",
    # que é usado por Let's Encrypt e por validações do Cloudflare.
    #
    # Este bloco dá prioridade (^~) para .well-known antes da
    # regra genérica de arquivos ocultos.
    #
    # [ Libera .well-known, que é necessário para validações ]
    # ============================================================
    location ^~ /.well-known/ {
        allow all;
        try_files $uri $uri/ =404;
    }


    # ============================================================
    # Main Magento application
    # [ Aplicação Principal Magento ]
    #
    # CORREÇÃO: $is_args$args em vez de ?$args — evita "??" e
    # preserva corretamente a query string.
    # ============================================================
    location / {
        limit_req zone=one burst=50 nodelay;

        try_files $uri $uri/ /index.php$is_args$args;
    }


    # ============================================================
    # Static Assets
    # [ Arquivos Estáticos ]
    # ============================================================
    location /static/ {
        try_files $uri $uri/ /static.php?resource=$uri&$args;

        expires max;
        access_log off;
    }


    # ============================================================
    # Static Content Versioning
    # [ Versionamento dos Arquivos Estáticos ]
    #
    # CORREÇÃO CRÍTICA: "break" -> "last"
    #
    # Com "break", o Nginx reescrevia a URI mas NÃO reavaliava
    # os locations, então a requisição não caía no "location /static/"
    # e acabava em 404 para CSS/JS/imagens versionados.
    #
    # Com "last", o Nginx reavalia os locations e a requisição
    # cai corretamente em "location /static/".
    #
    # [ Corrige o rewrite para reentrar no location /static/ ]
    # ============================================================
    location ~ ^/static/version {
        rewrite ^/static/version\d+/(.*)$ /static/$1 last;
    }


    # ============================================================
    # Magento WYSIWYG thumbnails
    #
    # Magento Media Gallery generates thumbnails inside:
    #
    #     pub/media/.thumbswysiwyg/
    #
    # This directory starts with "." and would normally be
    # blocked by the generic hidden-file rule below.
    #
    # The ^~ modifier gives this location priority over the
    # generic regex used to block hidden files.
    #
    # [ As thumbnails do Media Gallery ficam dentro de:
    #
    #   pub/media/.thumbswysiwyg/
    #
    #   Como o diretório começa com ".", a regra genérica
    #   de arquivos ocultos bloquearia essas imagens.
    #
    #   O ^~ garante prioridade para esta location. ]
    # ============================================================
    location ^~ /media/.thumbswysiwyg/ {
        expires max;
        access_log off;
    }


    # ============================================================
    # Magento 2 Media Library
    # [ Biblioteca de Mídia do Magento 2 ]
    # ============================================================
    location /media/ {
        try_files $uri $uri/ /get.php?$args;

        expires max;
        access_log off;
    }


    # ============================================================
    # Block sensitive files and backups
    #
    # [ Bloqueia arquivos sensíveis e backups ]
    # ============================================================
    location ~* \.(?:env|log|sql|lock|bak|old|orig|save|swp|tmp|gz|zip|tar|tgz|7z|rar|exe|piff)$ {
        deny all;
    }


    # ============================================================
    # Block sensitive Magento 2 directories
    #
    # app/
    # var/
    # vendor/
    # setup/
    # dev/
    #
    # These directories should not be directly accessible
    # through the web server in production.
    #
    # [ Diretórios internos do Magento 2 não devem ser acessíveis
    #   diretamente pelo servidor web em produção. ]
    # ============================================================
    location ~* ^/(?:app|var|vendor|setup|dev)(?:/|$) {
        deny all;
    }


    # ============================================================
    # Block hidden files and directories
    #
    # Examples:
    #
    # /.git
    # /.env
    # /.htaccess
    # /.user.ini
    #
    # .thumbswysiwyg and .well-known are explicitly handled above.
    #
    # [ Bloqueia arquivos e diretórios ocultos.
    #   .thumbswysiwyg e .well-known possuem exceções acima. ]
    # ============================================================
    location ~ /\. {
        deny all;
    }


    # ============================================================
    # PHP FastCGI
    # [ Processamento PHP através do PHP-FPM ]
    #
    # CORREÇÃO CRÍTICA: removido "try_files $uri =404;"
    #
    # Esse try_files era a causa nº 1 de 404 fantasma no Magento.
    # Ele testa o arquivo no filesystem do Nginx e, se por qualquer
    # motivo o arquivo não estiver visível naquele instante
    # (bind mount, overlay, race), retorna 404 mesmo o PHP-FPM
    # podendo servir.
    #
    # A segurança contra execução de PHP fora de pub/ já é
    # garantida por:
    #   - root $MAGE_ROOT/pub (SCRIPT_FILENAME só resolve em pub/)
    #   - location ~* ^/media/.*\.(php|...) -> 403
    #   - location ~* ^/(app|var|vendor|setup|dev) -> deny all
    #
    # [ Removido try_files para não causar 404 fantasma ]
    # ============================================================
    location ~ \.php$ {
        fastcgi_pass fastcgi_backend;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        fastcgi_param HTTPS on;
        fastcgi_param SERVER_PORT 443;

        include fastcgi_params;

        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Timeouts para operações longas (deploy, import, etc.)
        # [ Timeouts para evitar 504 em operações demoradas ]
        fastcgi_read_timeout 300s;
        fastcgi_connect_timeout 60s;
        fastcgi_send_timeout 300s;

        # Alterar o nome padrão do cookie PHPSESSID (teste de segurança)
        fastcgi_param PHP_VALUE "session.name=M2IDSS";
    }
}
