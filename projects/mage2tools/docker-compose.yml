services:
  magento_db:
    image: mariadb:11.4
    container_name: magento_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./data/db:/var/lib/mysql
    networks:
      - magento_rede
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15

  magento_redis:
    image: valkey/valkey:8
    container_name: magento_redis
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${VALKEY_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - magento_rede
    security_opt:
      - no-new-privileges:true

  magento_opensearch:
    image: opensearchproject/opensearch:3.0.0
    container_name: magento_opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms1g -Xmx1g"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD}
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    volumes:
      - ./data/opensearch:/usr/share/opensearch/data
    ulimits:
      memlock:
        soft: -1
        hard: -1
    networks:
      - magento_rede
    security_opt:
      - no-new-privileges:true

  magento_server:
    build: .
    container_name: magento_server
    restart: unless-stopped
    environment:
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - ./html:/var/www/html
      - ./data/composer:/home/magentouser/.composer
    expose:
      - "9000"
    depends_on:
      magento_db:
        condition: service_healthy
      magento_redis:
        condition: service_started
      magento_opensearch:
        condition: service_started
    networks:
      - magento_rede
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  magento_nginx:
    image: nginx:1.28-alpine
    container_name: magento_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./html:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      magento_server:
        condition: service_healthy
    networks:
      - magento_rede
    security_opt:
      - no-new-privileges:true

networks:
  magento_rede:
    driver: bridge

